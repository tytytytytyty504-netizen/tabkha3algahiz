<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طبخة على الجاهز</title>
    <style>
        :root {
            --primary: #ff6600;
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #b0b0b0;
        }
        body {
            font-family: Tahoma, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            padding-bottom: 70px;
        }
        header {
            background: var(--card-bg);
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #333;
        }
        .logo-img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
        }
        .search-box {
            padding: 10px;
            background: #181818;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .search-box input {
            width: 100%;
            padding: 10px;
            border-radius: 20px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: white;
            box-sizing: border-box;
            text-align: right;
        }
        .categories-nav {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            padding: 10px;
            background: #161616;
            white-space: nowrap;
        }
        .cat-btn {
            background: #2a2a2a;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
        }
        .cat-btn.active {
            background: var(--primary);
        }
        .container {
            padding: 10px;
        }
        .section-title {
            color: var(--primary);
            font-size: 18px;
            margin: 15px 0 10px 0;
            border-bottom: 2px solid #333;
            padding-bottom: 5px;
        }
        .item-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #333;
        }
        .item-info {
            flex-grow: 1;
            padding-right: 10px;
        }
        .item-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .item-price {
            color: var(--primary);
            font-weight: bold;
            font-size: 14px;
        }
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--primary);
            color: white;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-sizing: border-box;
            z-index: 999;
        }
        #cartModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            overflow-y: auto;
            padding: 15px;
            box-sizing: border-box;
        }
        .modal-content {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            max-width: 500px;
            margin: 20px auto;
        }
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            text-align: center;
            margin-top: 10px;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin: 5px 0 15px 0;
            border-radius: 5px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: white;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<header>
    <img src="logo.png" alt="Logo" class="logo-img">
    <h2>طبخة على الجاهز</h2>
</header>

<div class="search-box">
    <input type="text" id="searchInput" placeholder="دور على أي صنف... ورق عنب، بانيه، ملوخية" oninput="filterItems()">
</div>

<div class="categories-nav">
    <button class="cat-btn active" onclick="filterCategory('all')">كل الأقسام</button>
    <button class="cat-btn" onclick="filterCategory('offers')">🔥 العروض</button>
    <button class="cat-btn" onclick="filterCategory('ready')">أكلات للتسوية</button>
    <button class="cat-btn" onclick="filterCategory('veggies')">خضار جاهز</button>
    <button class="cat-btn" onclick="filterCategory('school')">وجبات المدرسة</button>
    <button class="cat-btn" onclick="filterCategory('family')">وجبات العيلة</button>
    <button class="cat-btn" onclick="filterCategory('trays')">صواني العيلة</button>
    <button class="cat-btn" onclick="filterCategory('extras')">الإضافات</button>
</div>

<div class="container" id="menuContainer">
    <!-- الأقسام والمنتجات -->
    <div class="section-title" data-cat="offers">🔥 العروض الخاصة</div>
    <div class="item-card" data-cat="offers">
        <div class="item-info">
            <div class="item-title">عرض ثوم مفروم صافي - 4 كيلو</div>
            <div class="item-price">450 جنيه</div>
        </div>
        <button class="btn" style="width: auto;" onclick="addToCart('عرض ثوم مفروم صافي - 4 كيلو', 450)">أضف للأوردر</button>
    </div>

    <div class="section-title" data-cat="ready">🍲 أكلات للتسوية</div>
    <div class="item-card" data-cat="ready">
        <div class="item-info">
            <div class="item-title">محشي كرنب محشي مسلوق</div>
            <div class="item-price">130 ج / كيلو</div>
        </div>
        <button class="btn" style="width: auto;" onclick="addToCart('محشي كرنب مسلوق', 130)">أضف للأوردر</button>
    </div>
    <div class="item-card" data-cat="ready">
        <div class="item-info">
            <div class="item-title">ورق عنب محشي</div>
            <div class="item-price">140 ج / كيلو</div>
        </div>
        <button class="btn" style="width: auto;" onclick="addToCart('ورق عنب محشي', 140)">أضف للأوردر</button>
    </div>
</div>

<!-- شريط السلة العائم -->
<div class="cart-bar" onclick="toggleCart()">
    🛒 السلة (<span id="cartCount">0</span> أصناف) - <span id="cartTotal">0</span> ج
</div>

<!-- نافذة السلة -->
<div id="cartModal">
    <div class="modal-content">
        <h3>أوردرك</h3>
        <button class="btn" style="background:#444; margin-bottom:15px;" onclick="toggleCart()">رجوع للمنيو</button>
        <div id="cartItemsList"></div>
        
        <hr style="border-color: #444;">
        <p>الأصناف: <span id="subTotal">0</span> ج</p>
        <p>التوصيل: 20 ج</p>
        <h3>الإجمالي بالتوصيل: <span id="grandTotal">20</span> ج</h3>

        <h4 style="margin-top:20px;">بيانات العميل</h4>
        <label>الاسم:</label>
        <input type="text" id="clientName" placeholder="مثال: منى أحمد">
        
        <label>رقم الموبايل:</label>
        <input type="tel" id="clientPhone" placeholder="01xxxxxxxxxx">

        <label>المنطقة:</label>
        <input type="text" id="clientArea" placeholder="مثال: سموحة، سيدي جابر...">

        <label>العنوان بالتفصيل:</label>
        <textarea id="clientAddress" placeholder="الشارع، رقم العمارة، الدور، الشقة"></textarea>

        <label>طريقة الدفع:</label>
        <select id="paymentMethod" onchange="togglePaymentInfo()">
            <option value="كاش عند الاستلام">كاش عند الاستلام</option>
            <option value="إنستاباي">إنستاباي (InstaPay)</option>
            <option value="محفظة">محفظة إلكترونية</option>
        </select>

        <div id="paymentInstructions" style="background:#2a2a2a; padding:10px; border-radius:5px; margin-bottom:15px; display:none; border: 1px solid var(--primary);">
            <p id="payText" style="margin:0; font-size:14px; color:#ffcc00;"></p>
        </div>

        <button class="btn" style="background: #25D366;" onclick="sendOrderToWhatsApp()">ابعت الأوردر على واتساب</button>
    </div>
</div>

<script>
    let cart = [];
    const deliveryFee = 20;

    function addToCart(name, price) {
        let existing = cart.find(item => item.name === name);
        if (existing) {
            existing.qty += 1;
        } else {
            cart.push({ name, price, qty: 1 });
        }
        updateCartUI();
    }

    function changeQty(index, delta) {
        cart[index].qty += delta;
        if (cart[index].qty <= 0) {
            cart.splice(index, 1);
        }
        updateCartUI();
    }

    function updateCartUI() {
        let count = 0;
        let subTotal = 0;
        let listHTML = '';

        cart.forEach((item, index) => {
            count += item.qty;
            subTotal += item.price * item.qty;
            listHTML += `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; background:#2a2a2a; padding:8px; border-radius:5px;">
                    <div>
                        <div><b>${item.name}</b></div>
                        <div style="color:var(--primary);">${item.price * item.qty} ج</div>
                    </div>
                    <div style="display:flex; align-items:center; gap:5px;">
                        <button onclick="changeQty(${index}, -1)" style="padding:5px 10px; background:#444; color:white; border:none; border-radius:3px; cursor:pointer;">-</button>
                        <span>${item.qty}</span>
                        <button onclick="changeQty(${index}, 1)" style="padding:5px 10px; background:var(--primary); color:white; border:none; border-radius:3px; cursor:pointer;">+</button>
                    </div>
                </div>
            `;
        });

        document.getElementById('cartCount').innerText = count;
        document.getElementById('cartTotal').innerText = subTotal > 0 ? subTotal + deliveryFee : 0;
        document.getElementById('subTotal').innerText = subTotal;
        document.getElementById('grandTotal').innerText = subTotal > 0 ? subTotal + deliveryFee : 20;
        document.getElementById('cartItemsList').innerHTML = listHTML || '<p style="text-align:center; color:#888;">السلة فارغة</p>';
    }

    function toggleCart() {
        let modal = document.getElementById('cartModal');
        modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
    }

    function togglePaymentInfo() {
        let method = document.getElementById('paymentMethod').value;
        let box = document.getElementById('paymentInstructions');
        let text = document.getElementById('payText');
        
        if (method === 'إنستاباي') {
            box.style.display = 'block';
            text.innerHTML = 'حول على إنستاباي: <b>01155499777</b><br>وابعت صورة التحويل في نفس شات الواتساب.';
        } else if (method === 'محفظة') {
            box.style.display = 'block';
            text.innerHTML = 'حول على المحفظة: <b>01288372467</b><br>وابعت صورة التحويل في نفس شات الواتساب.';
        } else {
            box.style.display = 'none';
        }
    }

    function filterCategory(cat) {
        document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        let sections = document.querySelectorAll('.section-title');
        let items = document.querySelectorAll('.item-card');

        sections.forEach(sec => {
            if (cat === 'all' || sec.getAttribute('data-cat') === cat) {
                sec.style.display = 'block';
            } else {
                sec.style.display = 'none';
            }
        });

        items.forEach(item => {
            if (cat === 'all' || item.getAttribute('data-cat') === cat) {
                item.style.display = 'flex';
            } else {
                item.style.display = 'none';
            }
        });
    }

    function filterItems() {
        let query = document.getElementById('searchInput').value.toLowerCase();
        let items = document.querySelectorAll('.item-card');
        items.forEach(item => {
            let text = item.innerText.toLowerCase();
            if (text.includes(query)) {
                item.style.display = 'flex';
            } else {
                item.style.display = 'none';
            }
        });
    }

    function sendOrderToWhatsApp() {
        let name = document.getElementById('clientName').value;
        let phone = document.getElementById('clientPhone').value;
        let area = document.getElementById('clientArea').value;
        let address = document.getElementById('clientAddress').value;
        let payment = document.getElementById('paymentMethod').value;

        if (!name || !phone || !area) {
            alert('من فضلك املأ الاسم ورقم الموبايل والمنطقة على الأقل!');
            return;
        }

        let subTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
        let total = subTotal + deliveryFee;

        let message = `*أوردر جديد من طبخة على الجاهز*%0A`;
        message += `------------------%0A`;
        cart.forEach(item => {
            message += `- ${item.name} (×${item.qty}) : ${item.price * item.qty} ج%0A`;
        });
        message += `------------------%0A`;
        message += `الأصناف: ${subTotal} ج%0A`;
        message += `التوصيل: ${deliveryFee} ج%0A`;
        message += `*الإجمالي الكلي: ${total} ج*%0A%0A`;
        message += `*بيانات العميل:*%0A`;
        message += `الاسم: ${name}%0A`;
        message += `الموبايل: ${phone}%0A`;
        message += `المنطقة: ${area}%0A`;
        message += `العنوان: ${address}%0A`;
        message += `طريقة الدفع: ${payment}%0A`;

        let whatsappUrl = `https://wa.me/201155499777?text=${message}`;
        window.open(whatsappUrl, '_blank');
    }
</script>

</body>
</html>
