<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طبخة على الجاهز | أكل بيتي وجهز على التسوية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #d35400;
            --secondary-color: #e67e22;
            --dark-color: #2c3e50;
            --light-bg: #fdfbf7;
            --white: #ffffff;
            --accent-green: #27ae60;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: var(--light-bg);
            color: var(--dark-color);
            line-height: 1.6;
        }
        header {
            background: linear-gradient(135deg, #d35400, #b94000);
            color: var(--white);
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        header h1 {
            font-size: 2.2rem;
            margin-bottom: 5px;
            font-weight: 900;
        }
        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .categories-nav {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }
        .categories-nav::-webkit-scrollbar {
            display: none;
        }
        .cat-btn {
            background: var(--white);
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            padding: 8px 16px;
            border-radius: 20px;
            white-space: nowrap;
            cursor: pointer;
            font-weight: 700;
            transition: 0.3s;
        }
        .cat-btn.active, .cat-btn:hover {
            background: var(--primary-color);
            color: var(--white);
        }
        h2.section-title {
            color: var(--primary-color);
            margin: 30px 0 15px;
            border-bottom: 2px dashed var(--primary-color);
            padding-bottom: 5px;
            font-size: 1.5rem;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }
        .menu-item {
            background: var(--white);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #eee;
        }
        .item-info h3 {
            font-size: 1.1rem;
            margin-bottom: 5px;
            color: var(--dark-color);
        }
        .item-price {
            color: var(--primary-color);
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 10px;
        }
        .add-btn {
            background: var(--accent-green);
            color: var(--white);
            border: none;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            width: 100%;
            transition: 0.2s;
        }
        .add-btn:hover {
            opacity: 0.9;
        }
        /* Floating Cart Bar */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--dark-color);
            color: var(--white);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.2);
            z-index: 1000;
        }
        .cart-bar button {
            background: #25d366;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
        /* Cart Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background: var(--white);
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            padding: 20px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content h3 {
            margin-bottom: 15px;
            color: var(--primary-color);
        }
        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        .close-modal {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            float: left;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>طبخة على الجاهز</h1>
        <p>أكل بيتي.. كل الأكل بيتي وبلمسة حب 🍲</p>
    </header>

    <div class="container">
        <!-- تصفية الأقسام -->
        <div class="categories-nav">
            <button class="cat-btn active" onclick="filterCategory('all')">الكل</button>
            <button class="cat-btn" onclick="filterCategory('ready')">أكلات جاهزة على التسوية</button>
            <button class="cat-btn" onclick="filterCategory('family')">وجبات العيلة (أكل مستوي)</button>
            <button class="cat-btn" onclick="filterCategory('school')">وجبات بعد المدرسة</button>
            <button class="cat-btn" onclick="filterCategory('veggies')">الخضار الجاهز</button>
            <button class="cat-btn" onclick="filterCategory('trays')">صواني العيلة</button>
            <button class="cat-btn" onclick="filterCategory('sandwiches')">سندوتشات المدرسة</button>
            <button class="cat-btn" onclick="filterCategory('extras')">الإضافات والصصوص</button>
        </div>

        <div id="menu-container"></div>
    </div>

    <!-- شريط السلة العائم -->
    <div class="cart-bar" id="cartBar" style="display:none;">
        <div>
            <span>السلة: <b id="cartCount">0</b> أصناف</span> | 
            <span>الإجمالي: <b id="cartTotal">0</b> ج</span>
        </div>
        <button onclick="openCheckout()">إتمام الأوردر 🛒</button>
    </div>

    <!-- نافذة إتمام الطلب -->
    <div class="modal" id="checkoutModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeCheckout()">إغلاق</button>
            <h3>تأكيد الطلب</h3>
            <div id="cartItemsList" style="margin-bottom: 15px;"></div>
            <div class="form-group">
                <label>الاسم:</label>
                <input type="text" id="clientName" placeholder="اكتب اسمك">
            </div>
            <div class="form-group">
                <label>العنوان بالتفصيل:</label>
                <textarea id="clientAddress" placeholder="المنطقة، الشارع، رقم العمارة..."></textarea>
            </div>
            <button class="add-btn" style="background:#25d366; font-size: 1.1rem; padding: 12px;" onclick="sendToWhatsApp()">إرسال الأوردر عبر واتساب 📱</button>
        </div>
    </div>

            { id: 90, name: "علبة صوص تومية", price: 20, category: "extras" },
            { id: 91, name: "خلطة محشي (1 كيلو)", price: 80, category: "extras" },
            { id: 92, name: "خلطة رز الحمام (1 كيلو)", price: 100, category: "extras" }
        ];

        let cart = [];

        function renderMenu(category = 'all') {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';
            
            const filtered = category === 'all' ? menuData : menuData.filter(item => item.category === category);
            
            filtered.forEach(item => {
                container.innerHTML += `
                    <div class="menu-item">
                        <div class="item-info">
                            <h3>${item.name}</h3>
                            <div class="item-price">${item.price} ج</div>
                        </div>
                        <button class="add-btn" onclick="addToCart(${item.id})">أضف للأوردر 🛒</button>
                    </div>
                `;
            });
        }

        function filterCategory(cat) {
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderMenu(cat);
        }

        function addToCart(id) {
            const item = menuData.find(i => i.id === id);
            const found = cart.find(i => i.id === id);
            if (found) {
                found.qty++;
            } else {
                cart.push({ ...item, qty: 1 });
            }
            updateCartUI();
        }

        function updateCartUI() {
            const cartBar = document.getElementById('cartBar');
            const cartCount = document.getElementById('cartCount');
            const cartTotal = document.getElementById('cartTotal');

            const totalCount = cart.reduce((sum, i) => sum + i.qty, 0);
            const totalPrice = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);

            if (totalCount > 0) {
                cartBar.style.display = 'flex';
                cartCount.innerText = totalCount;
                cartTotal.innerText = totalPrice;
            } else {
                cartBar.style.display = 'none';
            }
        }

        function openCheckout() {
            const modal = document.getElementById('checkoutModal');
            const list = document.getElementById('cartItemsList');
            list.innerHTML = '';

            cart.forEach(item => {
                list.innerHTML += `
                    <div class="cart-item-row">
                        <span>${item.name} (x${item.qty})</span>
                        <span>${item.price * item.qty} ج</span>
                    </div>
                `;
            });
            modal.style.display = 'flex';
        }

        function closeCheckout() {
            document.getElementById('checkoutModal').style.display = 'none';
        }

        function sendToWhatsApp() {
            const name = document.getElementById('clientName').value;
            const address = document.getElementById('clientAddress').value;

            if (!name || !address) {
                alert('من فضلك اكتب الاسم والعنوان لتأكيد الأوردر.');
                return;
            }

            let message = `السلام عليكم، عوز أطلب الأوردر ده من ع الحلة:\n\n`;
            cart.forEach(item => {
                message += `- ${item.name} (عدد: ${item.qty}) = ${item.price * item.qty} ج\n`;
            });

            const totalPrice = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            message += `\n*الإجمالي الكلي:* ${totalPrice} جنيه\n\n`;
            message += `*اسم العميل:* ${name}\n`;
            message += `*العنوان:* ${address}`;

            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/201129933758?text=${encodedMessage}`;
            
            window.open(whatsappUrl, '_blank');
        }

        // تشغيل المنيو عند فتح الصفحة
        renderMenu('all');
    </script>
</body>
</html>
