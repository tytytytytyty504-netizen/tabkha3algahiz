        let cart = [];

        function renderMenu(category = 'all', query = '') {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';
            
            let filtered = menuData;
            if (category !== 'all') {
                filtered = filtered.filter(item => item.category === category);
            }
            if (query.trim() !== '') {
                filtered = filtered.filter(item => item.name.toLowerCase().includes(query.toLowerCase()));
            }
            
            if (filtered.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#888; padding: 20px;">عذراً، لم نجد نتائج مطابقة لبحثك.</p>';
                return;
            }

            filtered.forEach(item => {
                container.innerHTML += `
                    <div class="menu-item">
                        <img src="${item.img}" alt="${item.name}">
                        <div class="item-details">
                            <div class="item-info">
                                <h3>${item.name}</h3>
                                <div class="item-price">${item.price} ج</div>
                            </div>
                            <button class="add-btn" onclick="addToCart(${item.id})">أضف للأوردر 🛒</button>
                        </div>
                    </div>
                `;
            });
        }

        function filterCategory(cat) {
            document.getElementById('searchInput').value = '';
            document.querySelectorAll('.cat-tab-btn').forEach(btn => btn.classList.remove('active'));
            event && event.target.classList.add('active');
            renderMenu(cat);
            scrollToMenu();
        }

        function searchMenu() {
            const query = document.getElementById('searchInput').value;
            renderMenu('all', query);
        }

        function scrollToMenu() {
            window.scrollTo({ top: 350, behavior: 'smooth' });
        }

        function addToCart(id) {
            const item = menuData.find(i => i.id === id);
            const found = cart.find(i => i.id === id);
            if (found) {
                found.qty++;
            } else {
                cart.push({ ...item, qty: 1 });
            }
            updateCartUI();
        }

        function removeFromCart(id) {
            cart = cart.filter(i => i.id !== id);
            updateCartUI();
            openCheckout();
            if(cart.length === 0) {
                closeCheckout();
            }
        }

        function updateCartUI() {
            const cartBar = document.getElementById('cartBar');
            const cartCount = document.getElementById('cartCount');
            const cartTotal = document.getElementById('cartTotal');

            const totalCount = cart.reduce((sum, i) => sum + i.qty, 0);
            const totalPrice = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);

            if (totalCount > 0) {
                cartBar.style.display = 'flex';
                cartCount.innerText = totalCount;
                cartTotal.innerText = totalPrice;
            } else {
                cartBar.style.display = 'none';
            }
        }

        function openCheckout() {
            if(cart.length === 0) {
                alert('السلة فارغة، أضف بعض الأكلات أولاً!');
                return;
            }
            const modal = document.getElementById('checkoutModal');
            const list = document.getElementById('cartItemsList');
            list.innerHTML = '';

            cart.forEach(item => {
                list.innerHTML += `
                    <div class="cart-item-row">
                        <div>
                            <strong>${item.name}</strong> (x${item.qty})<br>
                            <span style="color: #ff9f43; font-size: 0.85rem;">${item.price * item.qty} ج</span>
                        </div>
                        <button class="delete-item-btn" onclick="removeFromCart(${item.id})">حذف 🗑️</button>
                    </div>
                `;
            });
            modal.style.display = 'flex';
        }

        function closeCheckout() {
            document.getElementById('checkoutModal').style.display = 'none';
        }

        function sendToWhatsApp() {
            const name = document.getElementById('clientName').value;
            const address = document.getElementById('clientAddress').value;

            if (!name || !address) {
                alert('من فضلك اكتب اسمك وعنوانك بالكامل.');
                return;
            }

            let message = `السلام عليكم، عاوز أطلب الأوردر ده من *طبخة على الجاهز*:\n\n`;
            cart.forEach(item => {
                message += `- ${item.name} (عدد: ${item.qty}) = ${item.price * item.qty} ج\n`;
            });

            const totalPrice = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            message += `\n*الإجمالي الكلي:* ${totalPrice} جنيه\n\n`;
            message += `*اسم العميل:* ${name}\n`;
            message += `*العنوان:* ${address}`;

            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/201129933758?text=${encodedMessage}`, '_blank');
        }

        renderMenu('all');
    </script>
