<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم المركزية | طبخة على الجاهز</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --admin-bg: #0f172a;
            --admin-card: #1e293b;
            --admin-border: #334155;
            --admin-accent: #f59e0b;
            --admin-text: #f8fafc;
            --admin-muted: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--admin-bg); color: var(--admin-text); padding: 20px; min-height: 100vh; }

        .login-wrapper { display: flex; justify-content: center; align-items: center; min-height: 85vh; }
        .login-card { background: var(--admin-card); border: 1px solid var(--admin-border); padding: 30px; border-radius: 16px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .login-card h2 { color: var(--admin-accent); margin-bottom: 8px; font-size: 1.3rem; }
        .login-card p { color: var(--admin-muted); font-size: 0.85rem; margin-bottom: 20px; }

        .admin-panel { max-width: 1100px; margin: 0 auto; display: none; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; background: var(--admin-card); padding: 15px 25px; border-radius: 12px; border: 1px solid var(--admin-border); margin-bottom: 25px; }
        .admin-header h1 { font-size: 1.2rem; color: var(--admin-accent); }
        .visit-site-btn { background: #3b82f6; color: white; text-decoration: none; padding: 8px 16px; border-radius: 8px; font-size: 0.8rem; font-weight: bold; }

        .form-group { margin-bottom: 15px; text-align: right; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.8rem; color: var(--admin-accent); font-weight: bold; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px 14px; background: #0f172a; border: 1px solid var(--admin-border); border-radius: 8px; color: white; font-size: 0.9rem; outline: none; }
        .form-group input:focus { border-color: var(--admin-accent); }

        .btn-main { background: var(--admin-accent); color: #0f172a; border: none; padding: 11px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.9rem; width: 100%; transition: 0.2s; }
        .btn-main:hover { background: #d97706; color: white; }

        .admin-grid-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { background: var(--admin-card); color: var(--admin-muted); border: 1px solid var(--admin-border); padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
        .tab-btn.active { background: var(--admin-accent); color: #0f172a; border-color: var(--admin-accent); }

        .admin-section-box { display: none; background: var(--admin-card); border: 1px solid var(--admin-border); padding: 25px; border-radius: 14px; margin-bottom: 20px; }
        .admin-section-box.active { display: block; }
        .admin-section-box h3 { font-size: 1.05rem; color: var(--admin-accent); margin-bottom: 15px; border-bottom: 1px solid var(--admin-border); padding-bottom: 8px; }

        .data-row { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 12px 15px; border-radius: 8px; border: 1px solid var(--admin-border); margin-bottom: 10px; gap: 15px; }
        .action-btn { border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-success { background: var(--success); color: white; }
        .input-edit { width: 100px; background: #1e293b; border: 1px solid var(--admin-border); color: var(--admin-accent); padding: 5px; border-radius: 6px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول المركزية -->
    <div class="login-wrapper" id="loginWrapper">
        <div class="login-card">
            <h2>🛡️ لوحة التحكم المركزية</h2>
            <p>أدخل كلمة المرور السرية للوصول لإدارة الموقع</p>
            <div class="form-group">
                <input type="password" id="adminPassword" placeholder="كلمة المرور...">
            </div>
            <button class="btn-main" onclick="verifyLogin()">دخول لوحة التحكم 🚀</button>
        </div>
    </div>

    <!-- واجهة الإدارة والتحكم -->
    <div class="admin-panel" id="adminPanel">
        <div class="admin-header">
            <h1>⚙️ مركز إدارة «طبخة على الجاهز»</h1>
            <a href="index.html" target="_blank" class="visit-site-btn">🌐 استعراض موقع العملاء</a>
        </div>

        <div class="admin-grid-tabs">
            <button class="tab-btn active" onclick="switchTab('tab-categories', this)">📁 إدارة الأقسام (إضافة / حذف)</button>
            <button class="tab-btn" onclick="switchTab('tab-menu', this)">🍲 إدارة المنتجات والأسعار</button>
            <button class="tab-btn" onclick="switchTab('tab-add', this)">➕ إضافة منتج جديد</button>
            <button class="tab-btn" onclick="switchTab('tab-settings', this)">🛠️ إعدادات النصوص والتنبيهات</button>
        </div>

        <!-- 1. قسم إدارة الأقسام -->
        <div id="tab-categories" class="admin-section-box active">
            <h3>إضافة قسم جديد بالكامل للموقع</h3>
            <div style="background: #0f172a; padding: 15px; border-radius: 10px; border: 1px solid var(--admin-border); margin-bottom: 20px;">
                <div class="form-group"><label>معرف القسم بالإنجليزية (بدون مسافات، مثال: sweets):</label><input type="text" id="catKeyInput" placeholder="sweets"></div>
                <div class="form-group"><label>اسم القسم بالعربي (مثال: حلويات ومخبوزات):</label><input type="text" id="catNameInput" placeholder="حلويات ومخبوزات"></div>
                <div class="form-group"><label>رابط صورة القسم:</label><input type="text" id="catImgInput" placeholder="https://..."></div>
                <button class="btn-main" onclick="addNewCategoryCloud()">حفظ وإضافة القسم الجديد 📁</button>
            </div>
            <h3>الأقسام الحالية المتاحة في الموقع:</h3>
            <div id="categoriesListContainer"></div>
        </div>

        <!-- 2. قسم إدارة المنتجات والأسعار -->
        <div id="tab-menu" class="admin-section-box">
            <h3>تعديل أسعار وحالة المنتجات لحظياً</h3>
            <div id="menuItemsContainer" style="max-height: 55vh; overflow-y: auto;"></div>
        </div>

        <!-- 3. قسم إضافة منتج جديد -->
        <div id="tab-add" class="admin-section-box">
            <h3>إضافة صنف جديد للمنيو</h3>
            <div class="form-group"><label>اسم الصنف:</label><input type="text" id="newPName" placeholder="مثال: صينية مكرونة بشاميل"></div>
            <div class="form-group">
                <label>اختر القسم:</label>
                <select id="newPCategorySelect"></select>
            </div>
            <div class="form-group"><label>السعر (بالجنيه):</label><input type="number" id="newPPrice" placeholder="150"></div>
            <div class="form-group"><label>الوصف:</label><input type="text" id="newPDesc" placeholder="طازة وساخن..."></div>
            <div class="form-group"><label>رابط صورة الصنف:</label><input type="text" id="newPImg" placeholder="https://..."></div>
            <button class="btn-main" onclick="addNewProductCloud()">إضافة الصنف للمنيو 🍲</button>
        </div>

        <!-- 4. قسم الإعدادات -->
        <div id="tab-settings" class="admin-section-box">
            <h3>إعدادات الشريط المتحرك والموقع</h3>
            <div class="form-group"><label>نص شريط التنبيهات المتحرك أعلى الموقع:</label><textarea id="settingMarqueeText" rows="2"></textarea></div>
            <button class="btn-main" onclick="saveSettingsCloud()">حفظ الإعدادات 💾</button>
        </div>
    </div>

    <!-- مكتبات فايربيز SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyDYtOwL1mpCJgilnx4gBJEzNbJIIK_Vh7I",
          authDomain: "tabkha-c460d.firebaseapp.com",
          databaseURL: "https://tabkha-c460d-default-rtdb.firebaseio.com",
          projectId: "tabkha-c460d",
          storageBucket: "tabkha-c460d.firebasestorage.app",
          messagingSenderId: "415068140121",
          appId: "1:415068140121:web:3e89f2b9e7221326abb748",
          measurementId: "G-PK1D1TTD4L"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let categories = [];
        let menuItems = [];

        function verifyLogin() {
            const pass = document.getElementById('adminPassword').value;
            if(pass === "ammar2026") {
                document.getElementById('loginWrapper').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                initAdminData();
            } else {
                alert('كلمة المرور غير صحيحة!');
            }
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.admin-section-box').forEach(box => box.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function initAdminData() {
            db.ref('tabkha_categories').on('value', snap => {
                categories = snap.val() ? Object.values(snap.val()) : [];
                renderCategoriesAdmin();
                populateSelectDropdown();
            });

            db.ref('tabkha_menu').on('value', snap => {
                menuItems = snap.val() ? Object.values(snap.val()) : [];
                renderMenuAdmin();
            });

            db.ref('tabkha_marquee').on('value', snap => {
                document.getElementById('settingMarqueeText').value = snap.val() || "";
            });
        }

        function addNewCategoryCloud() {
            const key = document.getElementById('catKeyInput').value.trim();
            const name = document.getElementById('catNameInput').value.trim();
            const img = document.getElementById('catImgInput').value.trim() || "https://images.unsplash.com/photo-1543339308-43e59d6b73a6?w=100";

            if(!key || !name) { alert('أدخل المعرف والاسم بالعربي.'); return; }
            categories.push({ id: key, name: name, img: img });
            db.ref('tabkha_categories').set(categories);
            document.getElementById('catKeyInput').value = '';
            document.getElementById('catNameInput').value = '';
            document.getElementById('catImgInput').value = '';
            alert('تم إضافة القسم الجديد بنجاح!');
        }

        function renderCategoriesAdmin() {
            const container = document.getElementById('categoriesListContainer');
            container.innerHTML = '';
            categories.forEach((cat, index) => {
                container.innerHTML += `
                    <div class="data-row">
                        <div><strong>${cat.name}</strong> <span style="color:var(--admin-muted); font-size:0.75rem;">(${cat.id})</span></div>
                        <button class="action-btn btn-danger" onclick="deleteCategoryAdmin(${index})">حذف القسم</button>
                    </div>`;
            });
        }

        function deleteCategoryAdmin(index) {
            if(confirm('متأكد من حذف هذا القسم؟')) {
                categories.splice(index, 1);
                db.ref('tabkha_categories').set(categories);
            }
        }

        function populateSelectDropdown() {
            const sel = document.getElementById('newPCategorySelect');
            sel.innerHTML = '';
            categories.forEach(c => {
                sel.innerHTML += `<option value="${c.id}">${c.name}</option>`;
            });
        }

        function renderMenuAdmin() {
            const container = document.getElementById('menuItemsContainer');
            container.innerHTML = '';
            menuItems.forEach(item => {
                let statusBtn = item.available ? 
                    `<button class="action-btn btn-success" onclick="toggleItemStatus(${item.id})">نشط</button>` : 
                    `<button class="action-btn btn-danger" onclick="toggleItemStatus(${item.id})">موقف</button>`;

                container.innerHTML += `
                    <div class="data-row">
                        <div style="flex:1;"><input type="text" value="${item.name}" onchange="updateName(${item.id}, this.value)" style="background:#1e293b; border:1px solid var(--admin-border); color:#fff; padding:5px; width:100%; border-radius:6px;"></div>
                        <div><input type="number" class="input-edit" value="${item.price}" onchange="updatePrice(${item.id}, this.value)"> ج</div>
                        <div>${statusBtn}</div>
                        <button class="action-btn btn-danger" onclick="deleteMenuItem(${item.id})">حذف</button>
                    </div>`;
            });
        }

        function updateName(id, val) {
            const item = menuItems.find(i => i.id === id);
            if(item) { item.name = val; db.ref('tabkha_menu').set(menuItems); }
        }
        function updatePrice(id, val) {
            const item = menuItems.find(i => i.id === id);
            if(item) { item.price = parseFloat(val) || 0; db.ref('tabkha_menu').set(menuItems); }
        }
        function toggleItemStatus(id) {
            const item = menuItems.find(i => i.id === id);
            if(item) { item.available = !item.available; db.ref('tabkha_menu').set(menuItems); }
        }
        function deleteMenuItem(id) {
            if(confirm('متأكد من حذف هذا الصنف؟')) {
                menuItems = menuItems.filter(i => i.id !== id);
                db.ref('tabkha_menu').set(menuItems);
            }
        }

        function addNewProductCloud() {
            const name = document.getElementById('newPName').value.trim();
            const category = document.getElementById('newPCategorySelect').value;
            const price = parseFloat(document.getElementById('newPPrice').value) || 0;
            const img = document.getElementById('newPImg').value.trim() || "https://images.unsplash.com/photo-1543339308-43e59d6b73a6?w=400";

            if(!name || price <= 0) { alert('من فضلك أدخل الاسم والسعر الصحيح.'); return; }
            const newId = menuItems.length > 0 ? Math.max(...menuItems.map(i => i.id)) + 1 : 1;
            menuItems.push({ id: newId, name: name, category: category, price: price, weight: 'كيلو', hasWeight: true, top: false, img: img, available: true });
            db.ref('tabkha_menu').set(menuItems);
            document.getElementById('newPName').value = '';
            document.getElementById('newPPrice').value = '';
            alert('تم إضافة الصنف بنجاح!');
        }

        function saveSettingsCloud() {
            const marquee = document.getElementById('settingMarqueeText').value;
            db.ref('tabkha_marquee').set(marquee);
            alert('تم حفظ الإعدادات بنجاح!');
        }
    </script>
</body>
</html>
